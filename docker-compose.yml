# Optional: PostgreSQL for the SQLite -> Postgres cutover.
# SQLite (the default dev database) needs no container.
#
#   docker compose up -d postgres
#
# Then point the API at it:
#   Database__Provider=Postgres
#   Database__ConnectionString=Host=localhost;Database=ironandbreath;Username=postgres;Password=postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: ironandbreath-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ironandbreath
    ports:
      - "5432:5432"
    volumes:
      - ironandbreath-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ironandbreath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ironandbreath-pgdata:
